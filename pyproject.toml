[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "amlbot"
dynamic = ["version"]
description = "Strictly typed sync/async client and webhook verifier for the AMLBot web API."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Enzo Caceres", email = "enzo.caceres@crunchdao.com" }]
keywords = ["aml", "amlbot", "compliance", "crypto", "kyt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AnyIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "anyio>=4.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
socks = ["httpx[socks]>=0.27"]

[project.urls]
Homepage = "https://github.com/crunchdao/amlbot"
Documentation = "https://github.com/crunchdao/amlbot#readme"
Repository = "https://github.com/crunchdao/amlbot"
Issues = "https://github.com/crunchdao/amlbot/issues"
Changelog = "https://github.com/crunchdao/amlbot/releases"

[dependency-groups]
dev = [
    "anyio>=4.14",                              # start_soon() returns a TaskHandle in the tests
    "basedpyright>=1.20",
    "fastapi>=0.110",
    "httpx2>=2.16; python_version >= '3.11'",   # starlette's test client, unavailable on 3.10
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "starlette>=1.7",                           # first one compatible with anyio>=4.14
]

[tool.hatch.version]
path = "src/amlbot/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/amlbot"]

[tool.hatch.build.targets.sdist]
exclude = [".github"]

# --------------------------------------------------------------------------- pytest

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# The live tests only run when asked for, with `pytest -m live`: a `-m` given there wins.
addopts = ["-ra", "--strict-markers", "--strict-config", "-p", "anyio", "-m", "not live"]
xfail_strict = true
filterwarnings = [
    "error",
    # Python 3.10 cannot install httpx2, so starlette's test client still runs on httpx there.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "live: hits the real AMLBot API (needs AMLBOT_ACCESS_ID / AMLBOT_ACCESS_KEY)",
    "paid: consumes AMLBot credits (also needs AMLBOT_LIVE_PAID=1)",
]

[tool.coverage.run]
source = ["amlbot"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "@overload", "raise AssertionError", "assert_never\\("]

# --------------------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.10"
files = ["src", "tests", "examples"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
disallow_any_unimported = true
disallow_any_explicit = true
disallow_any_decorated = true
disallow_any_expr = false # pydantic.Field() and pytest.fixture are typed as returning Any
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
]

[[tool.mypy.overrides]]
# Optional imports (httpx CLI -> rich -> IPython, pytest.approx -> numpy) can reach stubs written
# for Python >= 3.12 when those packages happen to be installed. None of them are dependencies.
module = ["IPython", "IPython.*", "numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------- basedpyright

[tool.basedpyright]
include = ["src", "tests", "examples"]
pythonVersion = "3.10"
typeCheckingMode = "all"
reportImplicitStringConcatenation = false # conflicts with ruff's formatter

# --------------------------------------------------------------------------- ruff

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY001", # no license chosen yet; drop this once one is
    "COM812", # formatter-managed
    "D203",   # one-blank-line-before-class (conflicts with D211)
    "D213",   # multi-line-summary-second-line (conflicts with D212)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D",       # docstrings in tests are noise
    "PLR2004", # magic values are the point of assertions
    "S101",    # assert is how pytest works
    "S105",    # fake secrets
    "S106",
]
"examples/**" = ["INP001", "T201"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "amlbot.models._Model"]

[tool.ruff.lint.pydocstyle]
convention = "google"
